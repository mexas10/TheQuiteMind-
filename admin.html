    background-attachment: fixed, fixed, fixed, fixed;
    background-size: auto, auto, cover, cover;
    background-position: center, center, center, center;
    color:var(--forest);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
    overflow-x:hidden;
  }

  h1,h2,h3{
    font-family:'Bodoni Moda', serif;
    font-weight:450;
    letter-spacing:-0.01em;
    line-height:1.1;
  }

  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}

  ::selection{background:var(--brass-light); color:var(--forest);}

  /* thin, elegant scrollbars where supported */
  .day-panel, .main{scrollbar-width:thin; scrollbar-color:var(--brass-light) transparent;}
  .day-panel::-webkit-scrollbar{width:8px;}
  .day-panel::-webkit-scrollbar-track{background:transparent;}
  .day-panel::-webkit-scrollbar-thumb{background:var(--brass-light); border-radius:100px;}
  .day-panel::-webkit-scrollbar-thumb:hover{background:var(--brass);}

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes popIn{
    from{opacity:0; transform:scale(.97) translateY(6px);}
    to{opacity:1; transform:scale(1) translateY(0);}
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* -------------------- gate screen -------------------- */
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-card{
    width:100%;
    max-width:390px;
    background:rgba(250,247,239,.28);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--line-brass);
    border-radius:26px;
    padding:48px 40px 40px;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
    animation:popIn .55s var(--ease) both;
  }
  .gate-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--brass-light) 22%, var(--brass) 50%, var(--brass-light) 78%, transparent);
  }
  .gate-badge{
    width:52px; height:52px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--sage-light) 0%, var(--cream) 70%);
    border:1px solid var(--line-brass);
    color:var(--deep-sage);
    box-shadow:0 10px 22px -14px rgba(27,36,25,.35), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .gate-badge svg{width:22px; height:22px;}
  .gate-mark{
    font-family:'Bodoni Moda', serif;
    font-size:1.28rem;
    margin-bottom:8px;
  }
  .gate-mark em{color:var(--brass); font-style:italic;}
  .gate-sub{
    font-size:.86rem;
    color:var(--forest-70);
    margin-bottom:30px;
    line-height:1.55;
  }
  .gate-input-wrap{
    position:relative;
    margin-bottom:16px;
  }
  .gate-input{
    width:100%;
    padding:15px 46px 15px 18px;
    border-radius:12px;
    border:1px solid var(--line-brass);
    background:var(--cream);
    color:var(--forest);
    font-size:1rem;
    text-align:left;
    letter-spacing:.14em;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .gate-input::placeholder{letter-spacing:.02em; color:var(--forest-45);}
  .gate-input:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 4px rgba(166,129,63,.14);
  }
  .gate-input:disabled{
    opacity:.55;
    cursor:not-allowed;
  }
  .gate-toggle:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .gate-input.invalid{
    border-color:var(--clay-red);
  }
  .gate-input.invalid:focus{
    box-shadow:0 0 0 4px rgba(166,84,63,.14);
  }
  .gate-toggle{
    position:absolute;
    right:6px; top:50%;
    transform:translateY(-50%);
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--forest-70);
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, color .2s ease;
  }
  .gate-toggle:hover{background:var(--line-brass); color:var(--forest);}
  .gate-toggle svg{width:17px; height:17px;}
  .gate-btn{
    width:100%;
    padding:15px 16px;
    border-radius:100px;
    border:none;
    background:linear-gradient(155deg, #566E49, var(--deep-sage) 60%, #3A4E32);
    color:var(--cream-soft);
    font-size:.88rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-weight:600;
    box-shadow:0 14px 26px -14px rgba(58,78,50,.55), inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .25s var(--ease), box-shadow .25s var(--ease), opacity .2s ease;
    display:flex; align-items:center; justify-content:center; gap:9px;
  }
  .gate-btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 18px 32px -14px rgba(58,78,50,.6), inset 0 1px 0 rgba(255,255,255,.14);}
  .gate-btn:active:not(:disabled){transform:translateY(0);}
  .gate-btn:disabled{opacity:.7; cursor:default;}
  .gate-btn .gate-btn-spinner{
    width:14px; height:14px;
    border-radius:50%;
    border:2px solid rgba(250,247,239,.4);
    border-top-color:var(--cream-soft);
    animation:spin .6s linear infinite;
    display:none;
  }
  .gate-btn.checking .gate-btn-spinner{display:inline-block;}
  .gate-btn.checking .gate-btn-label{opacity:.85;}
  .gate-error{
    margin-top:16px;
    font-size:.82rem;
    color:var(--clay-red);
    display:none;
    align-items:center;
    justify-content:center;
    gap:6px;
    animation:fadeUp .25s var(--ease) both;
  }
  .gate-error svg{width:14px; height:14px; flex-shrink:0;}
  .gate-error.show{display:flex;}
  @keyframes shake{
    10%, 90% { transform:translateX(-1px); }
    20%, 80% { transform:translateX(2px); }
    30%, 50%, 70% { transform:translateX(-5px); }
    40%, 60% { transform:translateX(5px); }
  }
  .gate-card.shake{animation:shake .5s var(--ease);}

  /* -------------------- app shell -------------------- */
  .app{display:none; min-height:100vh; flex-direction:column;}
  .app.show{display:flex;}

  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding:17px 28px;
    background:rgba(250,247,239,.45);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .topbar::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--line-brass) 30%, var(--line-brass) 70%, transparent);
  }
  .topbar-brand{
    display:flex; align-items:center; gap:11px;
  }
  .topbar-mark{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px;
    padding:4px;
    border-radius:10px;
    overflow:hidden;
    background:var(--cream);
    border:1px solid var(--line-brass);
    box-shadow:0 6px 14px -6px rgba(27,36,25,.35), inset 0 1px 0 rgba(255,255,255,.5);
    flex-shrink:0;
  }
  .topbar-mark img{width:100%; height:100%; object-fit:contain; object-position:center;}
  .topbar-brand h1{font-size:1.18rem;}
  .topbar-brand h1 em{color:var(--brass); font-style:italic;}
  .topbar-brand span{
    font-size:.7rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--forest-70);
    border-left:1px solid var(--line-brass);
    padding-left:11px;
    margin-left:1px;
  }
  .topbar-clock{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:100px;
    border:1px solid var(--line-brass);
    background:var(--cream);
    color:var(--forest-70);
    font-size:.82rem;
  }
  .topbar-clock svg{width:14px; height:14px; flex-shrink:0; color:var(--brass);}
  .topbar-clock #clockTime{
    font-family:'Bodoni Moda', serif;
    font-weight:600;
    color:var(--forest);
    font-variant-numeric:tabular-nums;
  }
  .topbar-clock-tag{
    font-size:.66rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--forest-70);
    border-left:1px solid var(--line-brass);
    padding-left:8px;
  }
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .sync-status{
    display:flex; align-items:center; gap:6px;
    font-size:.72rem;
    color:var(--forest-45);
    letter-spacing:.01em;
    padding-right:4px;
    white-space:nowrap;
  }
  .sync-status::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background:var(--deep-sage);
    flex-shrink:0;
  }
  .sync-status.stale::before{background:var(--brass);}
  .search-bar{
    position:sticky;
    top:73px;
    z-index:19;
    padding:14px 28px;
    background:var(--cream);
    border-bottom:1px solid var(--line);
  }
  .search-field{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    max-width:520px;
    padding:11px 16px;
    background:var(--cream-soft);
    border:1px solid var(--line-brass);
    border-radius:100px;
    color:var(--forest-45);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .search-field:focus-within{
    border-color:var(--brass);
    color:var(--forest-70);
    box-shadow:0 0 0 3px rgba(166,129,63,.14), 0 1px 0 rgba(255,255,255,.6) inset;
  }
  .search-field svg{width:16px; height:16px; flex-shrink:0;}
  .search-field input{
    border:none; outline:none; background:transparent;
    font-size:.9rem; color:var(--forest); width:100%;
  }
  .search-field input::placeholder{color:var(--forest-45);}
  .search-clear{
    display:none;
    align-items:center;
    justify-content:center;
    width:20px; height:20px;
    flex-shrink:0;
    border-radius:50%;
    border:none;
    background:var(--line);
    color:var(--forest-70);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .search-clear svg{width:10px; height:10px;}
  .search-clear:hover{background:var(--brass); color:var(--cream-soft);}
  .search-field.has-value .search-clear{display:inline-flex;}
  .search-results{
    position:absolute;
    top:calc(100% + 8px); left:28px;
    width:100%; max-width:520px;
    max-height:360px;
    overflow-y:auto;
    background:var(--cream-soft);
    border:1px solid var(--line-brass);
    border-radius:16px;
    box-shadow:0 24px 48px -20px rgba(27,36,25,.35), var(--shadow-lg);
    display:none;
    z-index:30;
  }
  .search-results.open{display:block; animation:searchIn .18s var(--ease);}
  @keyframes searchIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
  .search-results-count{
    padding:10px 16px 6px;
    font-size:.68rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--forest-45);
  }
  .search-result-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:12px 16px;
    cursor:pointer;
    border-top:1px solid var(--line);
    transition:background .15s ease;
  }
  .search-results-count + .search-result-item{border-top:none;}
  .search-result-item:hover, .search-result-item.active{background:var(--cream);}
  .search-result-name{font-size:.86rem; font-weight:700; color:var(--forest);}
  .search-result-name mark{background:rgba(166,129,63,.24); color:inherit; border-radius:3px; padding:0 1px;}
  .search-result-meta{font-size:.74rem; color:var(--forest-70); margin-top:2px;}
  .search-result-empty{padding:22px 16px; text-align:center; font-size:.82rem; color:var(--forest-70);}
  .icon-btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 17px;
    border-radius:100px;
    border:1px solid var(--line-brass);
    background:var(--cream-soft);
    color:var(--forest);
    font-size:.8rem;
    font-weight:600;
    letter-spacing:.01em;
    transition:background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .icon-btn:hover{
    background:var(--cream);
    border-color:var(--brass);
    transform:translateY(-1px);
    box-shadow:0 12px 22px -14px rgba(166,129,63,.45), var(--shadow-sm);
  }
  .icon-btn:active{transform:translateY(0);}
  .icon-btn:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  .icon-btn svg{width:14px; height:14px; transition:transform .4s var(--ease);}
  .icon-btn.subtle{border-color:transparent; background:transparent; color:var(--forest-70); box-shadow:none;}
  .icon-btn.subtle:hover{background:var(--cream); border-color:var(--line-brass); box-shadow:none;}
  .icon-btn.spinning svg{animation:spin .7s linear infinite;}

  .main{
    flex:1;
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    gap:0;
    max-width:1320px;
    width:100%;
    margin:24px auto 40px;
    align-items:start;
    background:rgba(250,247,239,.28);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--line-brass);
    border-radius:24px;
    box-shadow:var(--shadow-lg);
  }

  /* -------------------- calendar -------------------- */
  .cal-panel{padding:30px 32px 60px; border-radius:24px 0 0 24px;}

  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .cal-title{font-size:1.6rem; transition:opacity .2s ease;}
  .cal-nav{display:flex; align-items:center; gap:7px;}
  .view-toggle{
    display:flex;
    padding:3px;
    border-radius:100px;
    background:var(--cream);
    border:1px solid var(--line-brass);
    margin-right:6px;
  }
  .view-toggle-btn{
    padding:7px 14px;
    border-radius:100px;
    border:none;
    background:transparent;
    color:var(--forest-70);
    font-size:.76rem;
    font-weight:700;
    letter-spacing:.02em;
    transition:background .2s ease, color .2s ease;
  }
  .view-toggle-btn.active{background:var(--forest); color:var(--cream-soft);}
  .cal-nav-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid var(--line-brass);
    background:var(--cream-soft);
    display:flex; align-items:center; justify-content:center;
    color:var(--forest);
    transition:background .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .cal-nav-btn:hover{background:var(--cream); transform:translateY(-1px); box-shadow:var(--shadow-sm);}
  .cal-nav-btn:active{transform:translateY(0);}
  .cal-nav-btn svg{width:16px; height:16px;}
  .cal-today-btn{
    margin-left:8px;
    padding:9px 16px;
    border-radius:100px;
    border:1px solid var(--line-brass);
    background:var(--cream-soft);
    font-size:.78rem;
    font-weight:600;
    color:var(--forest);
    transition:background .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .cal-today-btn:hover{background:var(--cream); transform:translateY(-1px); box-shadow:var(--shadow-sm);}

  .cal-legend{
    display:flex; gap:18px; flex-wrap:wrap;
    margin-bottom:20px;
    font-size:.78rem;
    color:var(--forest-70);
  }
  .cal-legend span{display:inline-flex; align-items:center; gap:7px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; box-shadow:0 0 0 3px rgba(0,0,0,0);}
  .dot.pending{background:var(--brass); box-shadow:0 0 0 3px rgba(166,129,63,.14);}
  .dot.confirmed{background:var(--deep-sage); box-shadow:0 0 0 3px rgba(71,96,61,.14);}
  .dot.cancelled{background:var(--clay-red); box-shadow:0 0 0 3px rgba(166,84,63,.14);}

  .cal-grid{
    border:1px solid var(--line-brass);
    border-radius:20px;
    overflow:hidden;
    background:var(--cream-soft);
    box-shadow:var(--shadow-md);
    animation:fadeUp .35s var(--ease) both;
  }
  .cal-dow-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    background:linear-gradient(180deg, var(--cream), rgba(239,233,218,.6));
    border-bottom:1px solid var(--line);
  }
  .cal-dow{
    padding:12px 0;
    text-align:center;
    font-size:.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--forest-70);
    font-weight:700;
  }
  .cal-weeks{display:grid;}
  .cal-week-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
  }
  .cal-cell{
    min-height:94px;
    padding:9px 9px 11px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    position:relative;
    cursor:pointer;
    transition:background .2s var(--ease);
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .cal-week-row .cal-cell:last-child{border-right:none;}
  .cal-week-row:last-child .cal-cell{border-bottom:none;}
  .cal-cell:hover{background:rgba(166,129,63,.06);}
  .cal-cell:not(.today):hover .cal-daynum{box-shadow:0 0 0 1px var(--line-brass) inset;}
  .cal-cell.outside{color:var(--forest-45); background:rgba(239,233,218,.4);}
  .cal-cell.outside:hover{background:rgba(239,233,218,.65);}
  .cal-cell.today .cal-daynum{
    background:linear-gradient(155deg, #566E49, var(--deep-sage) 70%);
    color:var(--cream-soft);
    box-shadow:0 4px 10px -4px rgba(71,96,61,.6);
  }
  .cal-cell.selected{
    background:var(--sage-light);
    box-shadow:inset 0 0 0 2px var(--brass);
  }
  .cal-cell.selected::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--brass) 50%, transparent);
  }
  .cal-daynum{
    width:25px; height:25px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:.8rem;
    font-weight:600;
    transition:box-shadow .2s ease;
  }
  .cal-dots{display:flex; gap:4px; flex-wrap:wrap;}
  .cal-count{
    margin-top:auto;
    font-size:.66rem;
    color:var(--forest-70);
    letter-spacing:.01em;
    font-weight:600;
  }

  /* -------------------- day panel -------------------- */
  .day-panel{
    position:sticky;
    top:121px;
    height:calc(100vh - 121px);
    overflow-y:auto;
    overflow-x:hidden;
    border-left:1px solid var(--line);
    background:linear-gradient(180deg, rgba(250,247,239,.26), rgba(250,247,239,.14));
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    padding:28px 24px 60px;
    border-radius:0 24px 24px 0;
  }
  .day-panel-head{margin-bottom:6px;}
  .day-panel-date{font-size:1.3rem; font-weight:500;}
  .day-panel-sub{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:24px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line-brass);
  }
  .day-empty{
    text-align:center;
    padding:64px 14px;
    color:var(--forest-70);
    font-size:.9rem;
    line-height:1.6;
    animation:fadeUp .3s var(--ease) both;
  }
  .day-empty svg{width:36px; height:36px; margin-bottom:16px; color:var(--brass); opacity:.8;}

  .booking-card{
    border:1px solid var(--line-brass);
    border-left:3px solid var(--line-brass);
    border-radius:16px;
    background:rgba(239,233,218,.34);
    -webkit-backdrop-filter:blur(8px) saturate(140%);
    backdrop-filter:blur(8px) saturate(140%);
    padding:17px 17px 15px;
    margin-bottom:13px;
    box-shadow:var(--shadow-sm);
    transition:transform .25s var(--ease), box-shadow .25s var(--ease);
    animation:fadeUp .35s var(--ease) both;
  }
  .booking-card.status-pending{border-left-color:var(--brass);}
  .booking-card.status-confirmed{border-left-color:var(--deep-sage);}
  .booking-card.status-cancelled{border-left-color:var(--clay-red); opacity:.72;}
  .booking-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .booking-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .booking-name{font-size:1rem; font-weight:700; font-family:'Bodoni Moda', serif;}
  .booking-service{font-size:.8rem; color:var(--forest-70); margin-top:2px;}
  .status-pill{
    font-size:.66rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:100px;
    white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px;
  }
  .status-pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0;}
  .status-pill.pending{background:rgba(166,129,63,.16); color:var(--brass);}
  .status-pill.confirmed{background:rgba(71,96,61,.16); color:var(--deep-sage);}
  .status-pill.cancelled{background:var(--clay-red-soft); color:var(--clay-red);}

  .booking-meta{
    font-size:.82rem;
    color:var(--forest-70);
    line-height:1.75;
    margin-bottom:14px;
    padding-top:2px;
  }
  .booking-meta b{color:var(--forest); font-weight:700; font-size:.88rem;}

  .booking-actions{display:flex; gap:8px;}
  .b-btn{
    flex:1;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 10px;
    border-radius:10px;
    border:1px solid var(--line-brass);
    background:var(--cream-soft);
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--forest);
    transition:background .2s var(--ease), opacity .2s ease, transform .2s var(--ease), box-shadow .2s var(--ease), color .2s ease;
  }
  .b-btn svg{width:13px; height:13px;}
  .b-btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:var(--shadow-sm);}
  .b-btn:active:not(:disabled){transform:translateY(0);}
  .b-btn.confirm{border-color:var(--deep-sage); color:var(--deep-sage);}
  .b-btn.confirm:hover:not(:disabled){background:var(--deep-sage); color:var(--cream-soft);}
  .b-btn.cancel{border-color:var(--clay-red); color:var(--clay-red);}
  .b-btn.cancel:hover:not(:disabled){background:var(--clay-red); color:var(--cream-soft);}
  .b-btn:disabled{opacity:.4; cursor:default;}

  /* -------------------- blocked days -------------------- */
  .cal-cell.blocked{
    background:repeating-linear-gradient(135deg, rgba(166,84,63,.05), rgba(166,84,63,.05) 6px, rgba(166,84,63,.1) 6px, rgba(166,84,63,.1) 12px);
  }
  .cal-cell.blocked .cal-daynum{color:var(--clay-red);}
  .cal-blocked-tag{
    font-size:.63rem;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--clay-red);
    display:flex; align-items:center; gap:3px;
  }
  .cal-blocked-tag svg{width:10px; height:10px;}

  .day-block-row{
    display:flex; flex-direction:column;
    gap:10px;
    margin-bottom:18px;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line-brass);
    background:var(--cream);
  }
  .day-block-row.is-blocked{border-color:var(--clay-red); background:var(--clay-red-soft);}
  .day-block-top{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .day-block-label{font-size:.78rem; color:var(--forest-70); display:flex; align-items:center; gap:7px;}
  .day-block-label svg{width:14px; height:14px; flex-shrink:0;}
  .day-block-row.is-blocked .day-block-label{color:var(--clay-red);}
  .day-block-btn{
    padding:7px 14px;
    border-radius:100px;
    border:1px solid var(--line-brass);
    background:var(--cream-soft);
    font-size:.74rem;
    font-weight:700;
    color:var(--forest);
    white-space:nowrap;
    transition:background .2s ease;
  }
  .day-block-btn:hover{background:var(--cream);}
  .day-block-row.is-blocked .day-block-btn{border-color:var(--clay-red); color:var(--clay-red);}
  .day-block-reason-input{
    width:100%;
    padding:9px 12px;
    border-radius:9px;
    border:1px solid var(--line-brass);
    background:var(--cream-soft);
    color:var(--forest);
    font-family:inherit;
    font-size:.78rem;
    outline:none;
    transition:border-color .2s ease;
  }
  .day-block-reason-input:focus{border-color:var(--brass); box-shadow:0 0 0 3px rgba(166,129,63,.14);}
  .day-block-reason-input::placeholder{color:var(--forest-45);}
  .day-block-reason-text{font-size:.78rem; color:var(--clay-red); font-style:italic;}

  /* -------------------- agenda view -------------------- */
  .agenda-day{margin-bottom:22px;}
  .agenda-day-head{
    display:flex; align-items:baseline; gap:10px;
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line-brass);
  }
  .agenda-day-date{font-family:'Bodoni Moda', serif; font-size:1.05rem;}
  .agenda-day-count{font-size:.76rem; color:var(--forest-70);}
  .agenda-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:11px 14px;
    border-radius:12px;
    border:1px solid var(--line-brass);
    background:var(--cream-soft);
    margin-bottom:8px;
    cursor:pointer;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .agenda-row:hover{transform:translateX(3px); box-shadow:var(--shadow-sm);}
  .agenda-row-left{display:flex; align-items:center; gap:12px; min-width:0;}
  .agenda-time{font-size:.78rem; font-weight:700; color:var(--forest-70); width:64px; flex-shrink:0;}
  .agenda-name{font-size:.86rem; font-weight:700; color:var(--forest); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agenda-service{font-size:.76rem; color:var(--forest-70);}
  .agenda-empty-day{font-size:.78rem; color:var(--forest-45); padding:4px 2px 0;}
  .agenda-status-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .agenda-status-dot.pending{background:var(--brass);}
  .agenda-status-dot.confirmed{background:var(--deep-sage);}
  .agenda-status-dot.cancelled{background:var(--clay-red);}

  /* -------------------- booking detail modal -------------------- */
  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(27,36,25,.45);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    z-index:100;
    align-items:center; justify-content:center;
    padding:24px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    width:100%; max-width:460px;
    max-height:88vh;
    overflow-y:auto;
    background:rgba(250,247,239,.4);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--line-brass);
    border-radius:22px;
    padding:32px 28px 28px;
    position:relative;
    box-shadow:var(--shadow-lg);
    animation:popIn .3s var(--ease) both;
  }
  .modal-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--brass-light) 22%, var(--brass) 50%, var(--brass-light) 78%, transparent);
  }
  .modal-close{
    position:absolute; top:16px; right:16px;
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--line-brass);
    background:var(--cream);
    color:var(--forest-70);
    font-size:1.2rem;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .modal-close:hover{background:var(--brass); border-color:var(--brass); color:var(--cream-soft); transform:rotate(90deg);}
  .modal-title{font-size:1.3rem; margin-bottom:2px; padding-right:30px;}
  .modal-sub{font-size:.82rem; color:var(--forest-70); margin-bottom:18px;}
  .modal-section{margin-bottom:18px;}
  .modal-section-label{
    font-size:.68rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--forest-70); font-weight:700; margin-bottom:8px;
  }
  .modal-detail-grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:10px 16px;
    font-size:.84rem;
  }
  .modal-detail-grid div span{display:block; font-size:.7rem; color:var(--forest-70); margin-bottom:2px;}
  .modal-notes-textarea{
    width:100%;
    min-height:80px;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line-brass);
    background:var(--cream);
    color:var(--forest);
    font-family:inherit;
    font-size:.84rem;
    line-height:1.5;
    resize:vertical;
    outline:none;
    transition:border-color .2s ease;
  }
  .modal-notes-textarea:focus{border-color:var(--brass); box-shadow:0 0 0 3px rgba(166,129,63,.14);}
  .modal-notes-counter{font-size:.68rem; color:var(--forest-45); text-align:right; margin:4px 0 10px;}
  .modal-notes-counter.over{color:var(--clay-red); font-weight:700;}
  .modal-save-btn{
    margin-top:10px;
    padding:9px 18px;
    border-radius:100px;
    border:none;
    background:linear-gradient(155deg, #566E49, var(--deep-sage) 65%, #3A4E32);
    color:var(--cream-soft);
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.02em;
    box-shadow:0 8px 18px -10px rgba(27,36,25,.5);
    transition:transform .2s var(--ease), box-shadow .2s var(--ease), opacity .2s ease;
  }
  .modal-save-btn:hover{transform:translateY(-1px); box-shadow:0 12px 24px -12px rgba(27,36,25,.55);}
  .modal-save-btn:disabled{opacity:.5; transform:none;}
  .modal-save-status{font-size:.76rem; color:var(--deep-sage); margin-left:10px;}
  .modal-actions{display:flex; gap:8px; margin-top:4px;}
  .history-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:.8rem;
  }
  .history-row:last-child{border-bottom:none;}
  .history-row-date{color:var(--forest-70);}
  .modal-empty{font-size:.8rem; color:var(--forest-70); padding:6px 0;}

  /* -------------------- upcoming rail (below calendar on mobile / summary) -------------------- */
  .section-eyebrow{
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:12px;
    display:flex; align-items:center; gap:10px;
  }
  .section-eyebrow::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--line-brass), transparent);
  }
  .summary-strip{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    margin-bottom:32px;
  }
  .summary-chip{
    position:relative;
    padding:18px 18px 16px;
    border-radius:16px;
    border:1px solid var(--line-brass);
    background:linear-gradient(160deg, var(--cream-soft), var(--cream) 130%);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    transition:transform .25s var(--ease), box-shadow .25s var(--ease);
    animation:fadeUp .4s var(--ease) both;
  }
  .summary-chip::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--brass);
  }
  .summary-chip.today::before{background:var(--deep-sage);}
  .summary-chip.upcoming::before{background:var(--sage);}
  .summary-chip.revenue::before{background:var(--brass);}
  .summary-chip:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);}
  .summary-chip-icon{
    position:absolute; top:16px; right:16px;
    width:30px; height:30px;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.55);
    border:1px solid var(--line-brass);
  }
  .summary-chip-icon svg{width:14px; height:14px;}
  .summary-chip.pending .summary-chip-icon{color:var(--brass);}
  .summary-chip.today .summary-chip-icon{color:var(--deep-sage);}
  .summary-chip.upcoming .summary-chip-icon{color:var(--sage);}
  .summary-chip.revenue .summary-chip-icon{color:var(--brass);}
  .summary-chip b{
    font-family:'Bodoni Moda', serif;
    font-weight:600;
    font-size:1.9rem;
    color:var(--forest);
    display:block;
    line-height:1;
    margin-bottom:8px;
    padding-right:36px;
  }
  .summary-chip-label{
    display:block;
    font-size:.76rem;
    letter-spacing:.01em;
    color:var(--forest-70);
  }

  .loading-line{
    text-align:center;
    padding:70px 20px;
    color:var(--forest-70);
    font-size:.88rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .loading-spinner{
    width:30px; height:30px;
    border-radius:50%;
    border:2.5px solid var(--line-brass);
    border-top-color:var(--brass);
    animation:spin .8s linear infinite;
  }

  /* -------------------- responsive -------------------- */
  @media (max-width: 980px){
    .summary-strip{grid-template-columns:repeat(2, 1fr);}
    .main{
      grid-template-columns:1fr;
      margin:12px; border-radius:16px; box-shadow:var(--shadow-sm);
    }
    .cal-panel{border-radius:16px 16px 0 0;}
    .day-panel{
      position:static;
      height:auto;
      border-left:none;
      border-top:1px solid var(--line);
      border-radius:0 0 16px 16px;
    }
    .topbar{flex-wrap:wrap; row-gap:10px;}
    .topbar-actions{flex-wrap:wrap; justify-content:flex-end; row-gap:8px;}
    /* Once the topbar can wrap to two rows, its height no longer matches
       the fixed 73px offset below, so drop the sticky behavior. Keep
       position:relative (not static) so the results dropdown — which is
       positioned absolutely against this bar — still anchors correctly
       instead of jumping to the top of the page. */
    .search-bar{position:relative; top:auto;}
    .cal-head{flex-wrap:wrap; row-gap:14px;}
    .cal-nav{flex-wrap:wrap; row-gap:8px;}
  }
  @media (max-width: 560px){
    .cal-panel{padding:20px 14px 40px;}
    .cal-cell{min-height:64px; padding:6px 4px 8px;}
    .cal-daynum{width:20px; height:20px; font-size:.72rem;}
    .topbar{padding:14px 16px;}
    .topbar-brand span{display:none;}
    .topbar-mark{width:30px; height:30px; font-size:.7rem;}
    .topbar-clock-tag{display:none;}
    .topbar-clock{padding:7px 11px;}
    .search-bar{padding:12px 16px;}
    .search-field{max-width:none;}
    .search-results{left:16px; right:16px; width:auto; max-width:none;}
    .icon-btn{font-size:.74rem; padding:8px 12px;}
    .icon-btn-label{display:none;}
    .sync-status{font-size:.66rem;}
    .summary-strip{grid-template-columns:1fr;}
    .cal-title{font-size:1.3rem;}
    .cal-nav-btn{width:34px; height:34px;}
    .cal-today-btn{padding:7px 12px; font-size:.74rem;}
    .view-toggle-btn{padding:6px 10px; font-size:.72rem;}
    .modal-overlay{padding:16px;}
    .modal-card{padding:26px 20px 22px;}
    .modal-detail-grid{grid-template-columns:1fr;}
    .gate-card{padding:40px 24px 32px;}
  }

</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card" id="gateCard">
    <div class="gate-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

      </button>

    <button class="gate-btn" id="gateBtn">

<script>
/* iOS Safari never applies :active CSS on tap unless some touch listener
   exists on the page — without this, buttons across the dashboard give
   no visual feedback on tap until whatever they do actually finishes.
   This just wakes that behavior up; it doesn't need to do anything itself. */
document.addEventListener('touchstart', function(){}, { passive: true });

/* ============================================================
   CONFIG — keep these two values identical to the CONFIG object
   in index.html. If you change the passcode or the Sheet URL
   there, update it here too.
   ============================================================ */
// The practice runs on East Africa Time (UTC+3, no daylight saving).
// Every "today"/"now" calculation in this dashboard is anchored to this
// timezone instead of the viewer's browser timezone — see ugandaNow().
const UGANDA_TZ = 'Africa/Kampala';

const CONFIG = {
  // The passcode is checked on the SERVER now (in booking-sync.gs), not here.
  // Nothing secret lives in this file anymore — view-source reveals no hash
  // to crack. To set/change your username + passcode, go to the Apps Script
  // editor > Project Settings (gear icon) > Script Properties, and set
  // ADMIN_CREDENTIAL_HASH to sha256("yourusername:yourpasscode") — lowercase
  // username, one colon, then the passcode, no spaces. Generate that hash
  // in any terminal with:
  //     echo -n "yourusername:yourpasscode" | shasum -a 256
  googleSheetUrl: "https://script.google.com/macros/s/AKfycbyrF9BJq7p1Su_JFEw0aCOwrqR-6kFwV3IpN86Esku3surn9nSYAiyC5Gzk29TSl5fX9w/exec",
  // Mirrors the prices in index.html's CONFIG.services — update both places if prices change.
  servicePrices: {
    "Child Therapy": 60,
    "Work & Career": 70,
    "Personal Therapy": 70,
    "Group Session": 100,
    "Family Therapy": 80,
    "Couples Therapy": 80
  }
};

/* ------------------------------------------------------------
   Rate limiting now happens server-side (Apps Script CacheService,
   keyed per-username) — see booking-sync.gs. Clearing localStorage
   or opening a private window no longer resets it, because the
   counter never lived in the browser to begin with.
   ------------------------------------------------------------ */
function msRemaining(){ return 0; } // gate is only ever disabled by an explicit server response now

function applyLockoutUI(){
  gateUser.disabled = false;
  gateInput.disabled = false;
  gateBtn.disabled = false;
  gateToggle.disabled = false;
}

/* ------------------------------------------------------------
   Passcode gate
   ------------------------------------------------------------ */
const gate = document.getElementById('gate');
const gateCard = document.getElementById('gateCard');
const app = document.getElementById('app');
const gateUser = document.getElementById('gateUser');
const gateInput = document.getElementById('gateInput');
const gateError = document.getElementById('gateError');
const gateBtn = document.getElementById('gateBtn');
const gateToggle = document.getElementById('gateToggle');

// Username isn't sensitive on its own (it's useless without the passcode),
// so remembering it locally is just a convenience — never store the passcode.
const REMEMBERED_USER_KEY = 'tqm_admin_last_user';
try {
  const rememberedUser = localStorage.getItem(REMEMBERED_USER_KEY);
  if (rememberedUser) gateUser.value = rememberedUser;
} catch (e) { /* localStorage unavailable — just skip the convenience */ }

const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.3 21.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 5c7 0 11 7 11 7a21.4 21.4 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

gateToggle.addEventListener('click', () => {
  const showing = gateInput.type === 'text';
  gateInput.type = showing ? 'password' : 'text';
  gateToggle.innerHTML = showing ? EYE_OPEN : EYE_CLOSED;
  gateToggle.setAttribute('aria-label', showing ? 'Show passcode' : 'Hide passcode');
  gateToggle.setAttribute('aria-pressed', String(!showing));
  gateInput.focus();
});

function clearGateError(){
  gateError.classList.remove('show');
  gateInput.classList.remove('invalid');
  gateUser.classList.remove('invalid');
  gateInput.setAttribute('aria-invalid', 'false');
}

function showGateError(message){
  gateError.querySelector('span').textContent = message || 'Incorrect username or passcode — try again.';
  gateError.classList.add('show');
  gateInput.classList.add('invalid');
  gateUser.classList.add('invalid');
  gateInput.setAttribute('aria-invalid', 'true');
  gateCard.classList.remove('shake');
  // restart the animation even if it's already mid-shake
  void gateCard.offsetWidth;
  gateCard.classList.add('shake');
  gateCard.addEventListener('animationend', () => gateCard.classList.remove('shake'), { once:true });
}

gateInput.addEventListener('input', clearGateError);
gateUser.addEventListener('input', clearGateError);

function focusGate(){
  // slight delay so it fires after any display/animation change.
  // Focus whichever field actually needs filling in first.
  setTimeout(() => (gateUser.value.trim() ? gateInput : gateUser).focus(), 50);
}

function unlock(){
  gate.style.display = 'none';
  app.classList.add('show');
  init();
}

document.getElementById('gateBtn').addEventListener('click', tryUnlock);
gateInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
gateUser.addEventListener('keydown', e => { if (e.key === 'Enter') gateInput.focus(); });

// Held only in memory for this tab — never written to localStorage or
// sessionStorage, so it disappears the moment the tab or page is closed.
let SESSION_TOKEN = null;

function tryUnlock(){
  const user = gateUser.value.trim();
  const value = gateInput.value.trim();
  if (!user || !value || gateBtn.classList.contains('checking')) return;

  gateBtn.classList.add('checking');
  gateBtn.disabled = true;

  fetch(CONFIG.googleSheetUrl, {
    method: 'POST',
    body: JSON.stringify({ action: 'login', user, pass: value })
  })
    .then(res => res.json())
    .then(data => {
      gateBtn.classList.remove('checking');
      gateBtn.disabled = false;

      if (data.success){
        SESSION_TOKEN = data.token;
        clearGateError();
        try { localStorage.setItem(REMEMBERED_USER_KEY, user); } catch (e) { /* non-essential */ }
        unlock();
      } else if (data.error === 'locked_out'){
        showGateError('Too many attempts. Try again shortly.');
        gateInput.value = '';
      } else {
        showGateError();
        gateInput.value = '';
        if (!gateInput.disabled) gateInput.focus();
      }
    })
    .catch(() => {
      gateBtn.classList.remove('checking');
      gateBtn.disabled = false;
      showGateError('Could not reach the server. Check your connection and try again.');
    });
}

document.getElementById('lockBtn').addEventListener('click', () => {
  SESSION_TOKEN = null;
  app.classList.remove('show');
  gate.style.display = 'flex';
  gateInput.value = '';
  gateInput.type = 'password';
  gateToggle.innerHTML = EYE_OPEN;
  gateToggle.setAttribute('aria-label', 'Show passcode');
  gateToggle.setAttribute('aria-pressed', 'false');
  clearGateError();
  focusGate();
  applyLockoutUI();
});

focusGate();
applyLockoutUI();

/* ------------------------------------------------------------
   Data layer — same contract as index.html's admin panel:
   GET the sheet for the full list, POST { action: 'updateStatus' }
   to change a booking's status.
   ------------------------------------------------------------ */
let bookings = [];               // flat list from the sheet
let blockedDates = [];           // dates (yyyy-MM-dd) the practice is unavailable
let blockedReasons = {};         // yyyy-MM-dd -> reason text, for blocked dates
let byDate = {};                 // date (yyyy-MM-dd) -> [bookings]
let viewYear, viewMonth;         // 0-indexed month, calendar currently showing
let selectedDate = null;         // yyyy-MM-dd currently open in the day panel
let calendarView = 'month';      // 'month' | 'agenda'

async function loadBookings(){
  if (!CONFIG.googleSheetUrl || !SESSION_TOKEN) return { bookings: [], blockedDates: [], blockedReasons: {} };
  try {
    const res = await fetch(CONFIG.googleSheetUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // avoids a CORS preflight Apps Script can't handle
      body: JSON.stringify({ action: 'adminFetch', token: SESSION_TOKEN })
    });
    if (!res.ok) return { bookings: [], blockedDates: [], blockedReasons: {} };
    const data = await res.json();
    if (!data.success && data.error === 'unauthorized'){ SESSION_TOKEN = null; unlockGateForReauth_(); }
    return { bookings: data.bookings || [], blockedDates: data.blockedDates || [], blockedReasons: data.blockedReasons || {} };
  } catch (e) {
    return { bookings: [], blockedDates: [], blockedReasons: {} };
  }
}

function unlockGateForReauth_(){
  app.classList.remove('show');
  gate.style.display = 'flex';
  showGateError('Your session expired. Please sign in again.');
}

async function postAction(payload){
  if (!CONFIG.googleSheetUrl || !SESSION_TOKEN) return null;
  try {
    const res = await fetch(CONFIG.googleSheetUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // avoids a CORS preflight Apps Script can't handle
      body: JSON.stringify(Object.assign({ token: SESSION_TOKEN }, payload))
    });
    const data = await res.json();
    if (!data.success && data.error === 'unauthorized'){ SESSION_TOKEN = null; unlockGateForReauth_(); }
    return data;
  } catch (e) {
    return null;
  }
}

function setBookingStatus(ref, status){ return postAction({ action: 'updateStatus', ref, status }); }
function setBookingNotes(ref, notes){ return postAction({ action: 'updateNotes', ref, notes }); }
function blockDay(date, reason){ return postAction({ action: 'blockDay', date, reason }); }
function unblockDay(date){ return postAction({ action: 'unblockDay', date }); }

// Returns a Date object whose getFullYear/getMonth/getDate/getDay/getHours
// etc. all reflect the current moment IN UGANDA — regardless of what
// timezone the browser viewing this page is actually in. This is what makes
// "today", the calendar's default month, and the summary stats line up with
// Uganda time even when someone opens the dashboard from somewhere else.
function ugandaNow(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: UGANDA_TZ,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  }).formatToParts(new Date());
  const get = (type) => parts.find(p => p.type === type).value;
  let hour = parseInt(get('hour'), 10);
  if (hour === 24) hour = 0; // some locales format midnight as "24"
  return new Date(
    parseInt(get('year'), 10),
    parseInt(get('month'), 10) - 1,
    parseInt(get('day'), 10),
    hour,
    parseInt(get('minute'), 10),
    parseInt(get('second'), 10)
  );
}

function todayISO(){
  const d = ugandaNow();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function niceDate(iso){
  if (!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

/* ------------------------------------------------------------
   Live Uganda time clock — the practice runs on East Africa Time
   (UTC+3, no daylight saving), so this gives anyone viewing the
   dashboard from another timezone a constant, correct reference
   point for what "now" means for a booking.
   ------------------------------------------------------------ */
const clockTimeEl = document.getElementById('clockTime');
const clockFormatter = new Intl.DateTimeFormat('en-GB', {
  timeZone: UGANDA_TZ,
  weekday: 'short',
  hour: '2-digit',
  minute: '2-digit'
});

function tickClock(){
  if (clockTimeEl) clockTimeEl.textContent = clockFormatter.format(new Date());
}
tickClock();
setInterval(tickClock, 1000 * 15); // minute-resolution display, no need to tick every second

/* ------------------------------------------------------------
   Init / refresh
   ------------------------------------------------------------ */
async function init(){
  const now = ugandaNow();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  await refreshData();
  selectDate(todayISO());
}

let lastSyncedAt = null;
const syncStatusEl = document.getElementById('syncStatus');

function renderSyncStatus(){
  if (!syncStatusEl) return;
  if (!lastSyncedAt){ syncStatusEl.textContent = ''; return; }
  const secs = Math.round((Date.now() - lastSyncedAt) / 1000);
  const label = secs < 10 ? 'Updated just now'
    : secs < 60 ? `Updated ${secs}s ago`
    : secs < 3600 ? `Updated ${Math.floor(secs / 60)}m ago`
    : `Updated ${Math.floor(secs / 3600)}h ago`;
  syncStatusEl.textContent = label;
  syncStatusEl.classList.toggle('stale', secs > 300); // flag the brass dot once data is 5+ min old
}
setInterval(renderSyncStatus, 15000);

async function refreshData(){
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.classList.add('spinning');
  refreshBtn.disabled = true;
  document.getElementById('calWrap').innerHTML = '<div class="loading-line"><span class="loading-spinner"></span>Loading bookings…</div>';
  const data = await loadBookings();
  bookings = data.bookings;
  blockedDates = data.blockedDates;
  blockedReasons = data.blockedReasons || {};
  byDate = {};
  bookings.forEach(b => {
    if (!b.date) return;
    (byDate[b.date] = byDate[b.date] || []).push(b);
  });
  renderSummary();
  renderCalendarView();
  if (selectedDate) renderDayPanel(selectedDate);
  refreshBtn.classList.remove('spinning');
  refreshBtn.disabled = false;
  lastSyncedAt = Date.now();
  renderSyncStatus();
}

document.getElementById('refreshBtn').addEventListener('click', refreshData);

/* ------------------------------------------------------------
   Summary strip
   ------------------------------------------------------------ */
function renderSummary(){
  const today = todayISO();
  const pending = bookings.filter(b => b.status === 'pending').length;
  const confirmedToday = (byDate[today] || []).filter(b => b.status !== 'cancelled').length;

  // Count bookings in the next 7 days (excluding cancelled).
  const now = ugandaNow();
  let upcoming7 = 0;
  for (let i = 0; i < 7; i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    upcoming7 += (byDate[key] || []).filter(b => b.status !== 'cancelled').length;
  }

  // Revenue for the current calendar month, confirmed bookings only.
  const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const revenue = bookings
    .filter(b => b.status === 'confirmed' && (b.date || '').startsWith(monthPrefix))
    .reduce((sum, b) => sum + (CONFIG.servicePrices[b.service] || 0), 0);

  const strip = document.getElementById('summaryStrip');
  strip.innerHTML = `
    <div class="summary-chip pending">
      <span class="summary-chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
      <span><b>${pending}</b><span class="summary-chip-label">awaiting confirmation</span></span>
    </div>
    <div class="summary-chip today">
      <span class="summary-chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>
      <span><b>${confirmedToday}</b><span class="summary-chip-label">today</span></span>
    </div>
    <div class="summary-chip upcoming">
      <span class="summary-chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h5l2-8 4 16 2-8h5"/></svg></span>
      <span><b>${upcoming7}</b><span class="summary-chip-label">in the next 7 days</span></span>
    </div>
    <div class="summary-chip revenue">
      <span class="summary-chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
      <span><b>$${revenue}</b><span class="summary-chip-label">confirmed this month</span></span>
    </div>
  `;
}

/* ------------------------------------------------------------
   Calendar rendering
   ------------------------------------------------------------ */
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderCalendar(){
  document.getElementById('calTitle').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const startWeekday = firstOfMonth.getDay(); // 0 = Sun
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

  // Build a flat list of 42 cells (6 weeks) so the grid height stays stable.
  const cells = [];
  for (let i = 0; i < startWeekday; i++){
    cells.push({ day: daysInPrevMonth - startWeekday + 1 + i, outside: true, monthOffset: -1 });
  }
  for (let d = 1; d <= daysInMonth; d++){
    cells.push({ day: d, outside: false, monthOffset: 0 });
  }
  while (cells.length % 7 !== 0 || cells.length < 42){
    const nextDay = cells.length - (startWeekday + daysInMonth) + 1;
    cells.push({ day: nextDay, outside: true, monthOffset: 1 });
    if (cells.length >= 42) break;
  }

  const today = todayISO();
  let html = '<div class="cal-grid"><div class="cal-dow-row">';
  DOW.forEach(d => html += `<div class="cal-dow">${d}</div>`);
  html += '</div><div class="cal-weeks">';

  for (let w = 0; w < cells.length / 7; w++){
    html += '<div class="cal-week-row">';
    for (let c = 0; c < 7; c++){
      const cell = cells[w*7 + c];
      let y = viewYear, m = viewMonth;
      if (cell.monthOffset === -1){ m -= 1; if (m < 0){ m = 11; y -= 1; } }
      if (cell.monthOffset === 1){ m += 1; if (m > 11){ m = 0; y += 1; } }
      const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(cell.day).padStart(2,'0')}`;
      const dayBookings = byDate[iso] || [];
      const isToday = iso === today;
      const isSelected = iso === selectedDate;
      const isBlocked = blockedDates.includes(iso);

      const statuses = new Set(dayBookings.map(b => b.status));
      let dots = '';
      ['pending','confirmed','cancelled'].forEach(s => {
        if (statuses.has(s)) dots += `<span class="dot ${s}"></span>`;
      });

      html += `
        <div class="cal-cell${cell.outside ? ' outside' : ''}${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}${isBlocked ? ' blocked' : ''}" data-date="${iso}">
          <span class="cal-daynum">${cell.day}</span>
          <div class="cal-dots">${dots}</div>
          ${isBlocked ? `<span class="cal-blocked-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m4.9 4.9 14.2 14.2"/></svg>Blocked</span>` : ''}
          ${dayBookings.length ? `<div class="cal-count">${dayBookings.length} booking${dayBookings.length > 1 ? 's' : ''}</div>` : ''}
        </div>`;
    }
    html += '</div>';
  }
  html += '</div></div>';

  document.getElementById('calWrap').innerHTML = html;

  document.querySelectorAll('.cal-cell').forEach(cell => {
    cell.addEventListener('click', () => selectDate(cell.dataset.date));
  });
}

/* ------------------------------------------------------------
   View router — Month grid vs Agenda list
   ------------------------------------------------------------ */
function renderCalendarView(){
  document.getElementById('viewMonthBtn').classList.toggle('active', calendarView === 'month');
  document.getElementById('viewAgendaBtn').classList.toggle('active', calendarView === 'agenda');
  document.querySelector('.cal-legend').style.display = calendarView === 'month' ? 'flex' : 'none';
  document.getElementById('prevMonth').style.display = calendarView === 'month' ? '' : 'none';
  document.getElementById('nextMonth').style.display = calendarView === 'month' ? '' : 'none';
  if (calendarView === 'month'){
    document.getElementById('calTitle').style.display = '';
    renderCalendar();
  } else {
    document.getElementById('calTitle').textContent = 'Next 14 days';
    renderAgenda();
  }
}

function renderAgenda(){
  const now = ugandaNow();
  now.setHours(0,0,0,0);
  let html = '';

  for (let i = 0; i < 14; i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayBookings = (byDate[iso] || []).slice().sort((a,b) => (a.time || '').localeCompare(b.time || ''));
    const isBlocked = blockedDates.includes(iso);
    const label = d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });

    html += `
      <div class="agenda-day">
        <div class="agenda-day-head">
          <span class="agenda-day-date">${label}</span>
          <span class="agenda-day-count">${isBlocked ? 'Blocked' : dayBookings.length ? `${dayBookings.length} booking${dayBookings.length > 1 ? 's' : ''}` : 'Nothing booked'}</span>
        </div>
        ${dayBookings.length === 0 ? '' : dayBookings.map(b => `
          <div class="agenda-row" data-ref="${escapeHtml(b.ref)}" data-date="${iso}">
            <div class="agenda-row-left">
              <span class="agenda-status-dot ${b.status}"></span>
              <span class="agenda-time">${escapeHtml(b.time || '')}</span>
              <span class="agenda-name">${escapeHtml(b.name || 'Unnamed')}</span>
            </div>
            <span class="agenda-service">${escapeHtml(b.service || '')}</span>
          </div>
        `).join('')}
      </div>`;
  }

  document.getElementById('calWrap').innerHTML = html;

  document.querySelectorAll('.agenda-row').forEach(row => {
    row.addEventListener('click', () => {
      selectedDate = row.dataset.date;
      renderDayPanel(selectedDate); // keep the day panel in sync with what was clicked in Agenda view
      openBookingModal(row.dataset.ref);
    });
  });
}

document.getElementById('viewMonthBtn').addEventListener('click', () => {
  calendarView = 'month';
  renderCalendarView();
});
document.getElementById('viewAgendaBtn').addEventListener('click', () => {
  calendarView = 'agenda';
  renderCalendarView();
});

document.getElementById('prevMonth').addEventListener('click', () => {
  viewMonth -= 1;
  if (viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  viewMonth += 1;
  if (viewMonth > 11){ viewMonth = 0; viewYear += 1; }
  renderCalendar();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  const now = ugandaNow();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  calendarView = 'month';
  renderCalendarView();
  selectDate(todayISO());
});

/* ------------------------------------------------------------
   Day panel — list + confirm/cancel actions for the selected day
   ------------------------------------------------------------ */
function selectDate(iso){
  selectedDate = iso;
  calendarView = 'month';
  // Jump the visible month if the selected date lives outside it.
  const [y, m] = iso.split('-').map(Number);
  if (y !== viewYear || (m - 1) !== viewMonth){
    viewYear = y; viewMonth = m - 1;
  }
  renderCalendarView();
  renderDayPanel(iso);
}

function renderDayPanel(iso){
  const panel = document.getElementById('dayPanel');
  const dayBookings = (byDate[iso] || []).slice().sort((a,b) => (a.time || '').localeCompare(b.time || ''));
  const isBlocked = blockedDates.includes(iso);
  const blockedReason = (blockedReasons && blockedReasons[iso]) || '';

  let html = `
    <div class="day-panel-head">
      <h3 class="day-panel-date">${niceDate(iso)}</h3>
    </div>
    <div class="day-panel-sub">${dayBookings.length ? `${dayBookings.length} booking${dayBookings.length > 1 ? 's' : ''}` : 'No bookings'}</div>
    <div class="day-block-row${isBlocked ? ' is-blocked' : ''}" id="dayBlockRow">
      <div class="day-block-top">
        <span class="day-block-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m4.9 4.9 14.2 14.2"/></svg>
          ${isBlocked ? 'This day is blocked' : 'Mark this day unavailable'}
        </span>
        <button class="day-block-btn" id="dayBlockBtn">${isBlocked ? 'Unblock' : 'Block day'}</button>
      </div>
      ${isBlocked
        ? (blockedReason ? `<div class="day-block-reason-text">Reason: ${escapeHtml(blockedReason)}</div>` : '')
        : `<input type="text" class="day-block-reason-input" id="dayBlockReasonInput" placeholder="Reason (optional) — e.g. holiday, personal time" maxlength="200">`
      }
    </div>
  `;

  if (dayBookings.length === 0){
    html += `
      <div class="day-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        Nothing booked on this day yet.
      </div>`;
  } else {
    dayBookings.forEach((b, i) => {
      html += `
        <div class="booking-card status-${b.status}" data-ref="${escapeHtml(b.ref)}" style="animation-delay:${Math.min(i,6) * 45}ms">
          <div class="booking-top">
            <div>
              <div class="booking-name">${escapeHtml(b.name || 'Unnamed')}</div>
              <div class="booking-service">${escapeHtml(b.service || '')}</div>
            </div>
            <span class="status-pill ${b.status}">${b.status}</span>
          </div>
          <div class="booking-meta">
            <b>${escapeHtml(b.time || '')}</b><br>
            ${b.phone ? escapeHtml(b.phone) + '<br>' : ''}
            ${b.email ? escapeHtml(b.email) + '<br>' : ''}
            Ref ${escapeHtml(b.ref || '—')}
          </div>
          <div class="booking-actions">
            <button class="b-btn confirm" data-action="confirmed" ${b.status === 'confirmed' ? 'disabled' : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              Confirm
            </button>
            <button class="b-btn cancel" data-action="cancelled" ${b.status === 'cancelled' ? 'disabled' : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              Cancel
            </button>
          </div>
        </div>`;
    });
  }

  panel.innerHTML = html;

  document.getElementById('dayBlockBtn').addEventListener('click', async (e) => {
    e.target.disabled = true;
    if (isBlocked) {
      await unblockDay(iso);
    } else {
      const reasonInput = document.getElementById('dayBlockReasonInput');
      await blockDay(iso, reasonInput ? reasonInput.value.trim() : '');
    }
    await refreshData();
  });

  panel.querySelectorAll('.booking-card').forEach(card => {
    const ref = card.dataset.ref;
    card.addEventListener('click', (e) => {
      if (e.target.closest('.b-btn')) return; // let action buttons handle their own click
      openBookingModal(ref);
    });
    card.querySelectorAll('.b-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const status = btn.dataset.action;
        card.querySelectorAll('.b-btn').forEach(b => b.disabled = true);
        const result = await setBookingStatus(ref, status);
        if (!result || result.success === false){
          alert('Could not update that booking — check your connection and try again.');
          card.querySelectorAll('.b-btn').forEach(b => b.disabled = false);
          return;
        }
        await refreshData();
      });
    });
  });
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ------------------------------------------------------------
   Booking detail modal — full info, notes, client history
   ------------------------------------------------------------ */
const modalOverlay = document.getElementById('modalOverlay');
const modalBody = document.getElementById('modalBody');

function closeModal(){ modalOverlay.classList.remove('open'); }
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

function openBookingModal(ref){
  const b = bookings.find(x => x.ref === ref);
  if (!b) return;

  // Other bookings from the same client, most recent first. Trimmed/cased
  // defensively so leftover formatting quirks (whitespace, email case, or a
  // legacy numeric phone value from before the sheet was locked to plain
  // text) don't cause a false match with a different client.
  const norm = (s) => String(s || '').trim();
  const bPhone = norm(b.phone);
  const bEmail = norm(b.email).toLowerCase();
  const history = bookings
    .filter(x => x.ref !== ref && (
      (bPhone && norm(x.phone) === bPhone) ||
      (bEmail && norm(x.email).toLowerCase() === bEmail)
    ))
    .sort((a,c) => (c.date || '').localeCompare(a.date || ''));

  modalBody.innerHTML = `
    <h3 class="modal-title">${escapeHtml(b.name || 'Unnamed')}</h3>
    <div class="modal-sub">${escapeHtml(b.service || '')} · <span class="status-pill ${b.status}" style="margin-left:2px;">${b.status}</span></div>

    <div class="modal-section">
      <div class="modal-section-label">Details</div>
      <div class="modal-detail-grid">
        <div><span>Date</span>${niceDate(b.date)}</div>
        <div><span>Time</span>${escapeHtml(b.time || '—')}</div>
        <div><span>Phone</span>${b.phone ? escapeHtml(b.phone) : '—'}</div>
        <div><span>Email</span>${b.email ? escapeHtml(b.email) : '—'}</div>
        <div><span>Reference</span>${escapeHtml(b.ref || '—')}</div>
        <div><span>Price</span>${CONFIG.servicePrices[b.service] ? '$' + CONFIG.servicePrices[b.service] : '—'}</div>
        <div><span>Reschedules</span>${(b.rescheduleCount || 0)} of 2 used</div>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">Actions</div>
      <div class="modal-actions">
        <button class="b-btn confirm" id="modalConfirmBtn" ${b.status === 'confirmed' ? 'disabled' : ''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Confirm
        </button>
        <button class="b-btn cancel" id="modalCancelBtn" ${b.status === 'cancelled' ? 'disabled' : ''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          Cancel
        </button>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">Private notes</div>
      <textarea class="modal-notes-textarea" id="modalNotes" placeholder="e.g. prefers evening sessions, follow up about referral…">${escapeHtml(b.notes || '')}</textarea>
      <div class="modal-notes-counter" id="modalNotesCounter"></div>
      <button class="modal-save-btn" id="modalSaveNotes">Save note</button>
      <span class="modal-save-status" id="modalSaveStatus"></span>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">Client history</div>
      ${history.length === 0
        ? '<div class="modal-empty">No other sessions on record for this client.</div>'
        : history.map(h => `
          <div class="history-row">
            <span>${escapeHtml(h.service || '')}</span>
            <span class="history-row-date">${h.date} · <span class="status-pill ${h.status}">${h.status}</span></span>
          </div>`).join('')
      }
    </div>
  `;

  document.getElementById('modalConfirmBtn').addEventListener('click', () => modalUpdateStatus(ref, 'confirmed'));
  document.getElementById('modalCancelBtn').addEventListener('click', () => modalUpdateStatus(ref, 'cancelled'));

  // ---- Notes word limit ----
  const NOTES_WORD_LIMIT = 100;
  const notesEl = document.getElementById('modalNotes');
  const notesCounterEl = document.getElementById('modalNotesCounter');
  const countWords = (text) => { const t = (text || '').trim(); return t ? t.split(/\s+/).length : 0; };
  const limitToWords = (text, limit) => {
    const words = (text || '').trim().split(/\s+/).filter(Boolean);
    return words.length <= limit ? text : words.slice(0, limit).join(' ');
  };
  const updateNotesCounter = () => {
    const count = countWords(notesEl.value);
    notesCounterEl.textContent = `${count}/${NOTES_WORD_LIMIT} words`;
    notesCounterEl.classList.toggle('over', count > NOTES_WORD_LIMIT);
  };
  notesEl.addEventListener('input', () => {
    if (countWords(notesEl.value) > NOTES_WORD_LIMIT){
      const atEnd = notesEl.selectionStart === notesEl.value.length;
      notesEl.value = limitToWords(notesEl.value, NOTES_WORD_LIMIT);
      if (atEnd) notesEl.selectionStart = notesEl.selectionEnd = notesEl.value.length;
    }
    updateNotesCounter();
  });
  updateNotesCounter();

  document.getElementById('modalSaveNotes').addEventListener('click', async () => {
    const btn = document.getElementById('modalSaveNotes');
    const status = document.getElementById('modalSaveStatus');
    btn.disabled = true;
    const notesValue = limitToWords(document.getElementById('modalNotes').value, NOTES_WORD_LIMIT);
    const result = await setBookingNotes(ref, notesValue);
    btn.disabled = false;
    if (!result || result.success === false){
      status.textContent = 'Could not save — try again.';
      status.style.color = 'var(--clay-red)';
    } else {
      b.notes = notesValue; // keep in-memory copy in sync without a full refetch
      status.textContent = 'Saved';
      status.style.color = 'var(--deep-sage)';
      setTimeout(() => { status.textContent = ''; }, 2000);
    }
  });

  modalOverlay.classList.add('open');
}

async function modalUpdateStatus(ref, status){
  document.getElementById('modalConfirmBtn').disabled = true;
  document.getElementById('modalCancelBtn').disabled = true;
  const result = await setBookingStatus(ref, status);
  if (!result || result.success === false){
    alert('Could not update that booking — check your connection and try again.');
    document.getElementById('modalConfirmBtn').disabled = false;
    document.getElementById('modalCancelBtn').disabled = false;
    return;
  }
  await refreshData();
  closeModal();
}

/* ------------------------------------------------------------
   Search — name, reference, phone, email across all bookings
   ------------------------------------------------------------ */
const searchField = document.getElementById('searchField');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchResults = document.getElementById('searchResults');
let searchDebounce = null;
let searchActiveIndex = -1;

function escapeRegExp(str){ return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlightMatch(text, q){
  const safe = escapeHtml(text || '');
  if (!q) return safe;
  const re = new RegExp('(' + escapeRegExp(q) + ')', 'ig');
  return escapeHtml(text || '').replace(re, '<mark>$1</mark>');
}

function closeSearchResults(){
  searchResults.classList.remove('open');
  searchInput.setAttribute('aria-expanded', 'false');
  searchActiveIndex = -1;
}

function runSearch(){
  const q = searchInput.value.trim().toLowerCase();
  searchField.classList.toggle('has-value', searchInput.value.length > 0);

  if (!q){ closeSearchResults(); return; }

  let matches = [];
  try {
    matches = bookings.filter(b =>
      String(b.name || '').toLowerCase().includes(q) ||
      String(b.ref || '').toLowerCase().includes(q) ||
      String(b.phone || '').toLowerCase().includes(q) ||
      String(b.email || '').toLowerCase().includes(q)
    ).slice(0, 20);
  } catch (err) {
    console.error('Search filter failed:', err);
    matches = [];
  }

  // Highlight the top result by default so Enter opens it immediately —
  // without this, Enter does nothing until the user presses an arrow key first.
  searchActiveIndex = matches.length ? 0 : -1;

  const countLabel = matches.length
    ? `<div class="search-results-count">${matches.length} match${matches.length === 1 ? '' : 'es'}</div>`
    : '';

  searchResults.innerHTML = matches.length === 0
    ? '<div class="search-result-empty">No bookings match "' + escapeHtml(searchInput.value.trim()) + '".</div>'
    : countLabel + matches.map(b => `
        <div class="search-result-item" role="option" data-ref="${escapeHtml(b.ref)}" data-date="${escapeHtml(b.date)}">
          <span>
            <span class="search-result-name">${highlightMatch(b.name || 'Unnamed', q)}</span><br>
            <span class="search-result-meta">${escapeHtml(b.service || '')} · ${b.date}</span>
          </span>
          <span class="status-pill ${b.status}">${b.status}</span>
        </div>
      `).join('');

  searchResults.querySelectorAll('.search-result-item').forEach(item => {
    item.addEventListener('click', () => selectSearchResult(item));
    item.addEventListener('mouseenter', () => {
      searchActiveIndex = [...searchResults.querySelectorAll('.search-result-item')].indexOf(item);
      updateActiveResult();
    });
  });

  searchResults.classList.add('open');
  searchInput.setAttribute('aria-expanded', 'true');
  updateActiveResult();
}

function selectSearchResult(item){
  searchInput.value = '';
  searchField.classList.remove('has-value');
  closeSearchResults();
  selectDate(item.dataset.date);
  openBookingModal(item.dataset.ref);
}

function updateActiveResult(){
  const items = [...searchResults.querySelectorAll('.search-result-item')];
  items.forEach((el, i) => el.classList.toggle('active', i === searchActiveIndex));
  if (items[searchActiveIndex]) items[searchActiveIndex].scrollIntoView({ block: 'nearest' });
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(runSearch, 120);
});

searchInput.addEventListener('keydown', (e) => {
  const items = searchResults.classList.contains('open')
    ? [...searchResults.querySelectorAll('.search-result-item')]
    : [];
  if (e.key === 'ArrowDown'){
    if (!items.length) return;
    e.preventDefault();
    searchActiveIndex = (searchActiveIndex + 1) % items.length;
    updateActiveResult();
  } else if (e.key === 'ArrowUp'){
    if (!items.length) return;
    e.preventDefault();
    searchActiveIndex = (searchActiveIndex - 1 + items.length) % items.length;
    updateActiveResult();
  } else if (e.key === 'Enter'){
    if (searchActiveIndex >= 0 && items[searchActiveIndex]){
      e.preventDefault();
      selectSearchResult(items[searchActiveIndex]);
    }
  } else if (e.key === 'Escape'){
    searchInput.value = '';
    searchField.classList.remove('has-value');
    closeSearchResults();
    searchInput.blur();
  }
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchField.classList.remove('has-value');
  closeSearchResults();
  searchInput.focus();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-bar')) closeSearchResults();
});

/* ------------------------------------------------------------
   CSV export
   ------------------------------------------------------------ */
document.getElementById('exportBtn').addEventListener('click', () => {
  const header = ['Name','Service','Date','Time','Phone','Email','Status','Reference','Notes'];
  const rows = bookings
    .slice()
    .sort((a,b) => (a.date || '').localeCompare(b.date || ''))
    .map(b => [b.name, b.service, b.date, b.time, b.phone, b.email, b.status, b.ref, b.notes || '']);

  const csvEscape = (val) => {
    const s = String(val ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };

  const csv = [header, ...rows].map(row => row.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bookings-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
